    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e7ff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#22e7ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="800"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
