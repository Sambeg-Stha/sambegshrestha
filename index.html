<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sambeg Shrestha</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="floating.css">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: 'Unica One', Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 2rem;
            /* Adds space around the content inside the box */
        }

        h1 {
            font-family: 'Italiana', serif;
            font-size: 3rem;
            color: #222;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #666;
        }

        /* Mobile: smaller heading/text and lighter padding so nothing overflows */
        @media (max-width: 600px) {
            body {
                height: auto;
                min-height: 100vh;
                padding: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background video: loops behind everything, stays fixed while scrolling -->
    <video id="bg-video" class="bg-video" autoplay muted loop playsinline></video>
    <!-- Dark overlay that keeps text readable on top of the video -->
    <div class="bg-overlay"></div>

    <nav id="main-nav" class="nav" aria-label="Main navigation" data-animate="fade-up">
        <ul class="nav__list">
            <!-- Each li = one nav item, each a = one clickable link -->
            <li class="nav__item"><a href="#" class="nav__link">Home</a></li>
            <li class="nav__item"><a href="#" class="nav__link">About</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Projects</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero: central name with 4 floating project cards around it -->
    <section class="hero">
        <!-- ===== REUSABLE FLOATING PROJECT CARD =====
             To add another one elsewhere on the site, copy this block and change:
               float-card--N : the position number (see floating.css)
               href          : your project link (put it here later)
               src           : your project image
               title/desc    : the text shown on hover
             ========================================== -->
        <a class="float-card float-card--1" href="#" data-animate="fade-up" data-animate-delay="0.2">
            <span class="float-card__bob">
                <span class="float-card__rot">
                    <img class="float-card__media" src="assets/img1.png" alt="Project 1">
                    <span class="float-card__info">
                        <strong class="float-card__title">Project Alpha</strong>
                        <span class="float-card__desc">Short description of this project.</span>
                    </span>
                </span>
            </span>
        </a>

        <a class="float-card float-card--2" href="#" data-animate="fade-up" data-animate-delay="0.4">
            <span class="float-card__bob">
                <span class="float-card__rot">
                    <img class="float-card__media" src="assets/img2.png" alt="Project 2">
                    <span class="float-card__info">
                        <strong class="float-card__title">Project Beta</strong>
                        <span class="float-card__desc">Short description of this project.</span>
                    </span>
                </span>
            </span>
        </a>

        <a class="float-card float-card--3" href="#" data-animate="fade-up" data-animate-delay="0.6">
            <span class="float-card__bob">
                <span class="float-card__rot">
                    <img class="float-card__media" src="assets/img3.png" alt="Project 3">
                    <span class="float-card__info">
                        <strong class="float-card__title">Project Gamma</strong>
                        <span class="float-card__desc">Short description of this project.</span>
                    </span>
                </span>
            </span>
        </a>

        <a class="float-card float-card--4" href="#" data-animate="fade-up" data-animate-delay="0.8">
            <span class="float-card__bob">
                <span class="float-card__rot">
                    <img class="float-card__media" src="assets/img4.png" alt="Project 4">
                    <span class="float-card__info">
                        <strong class="float-card__title">Project Delta</strong>
                        <span class="float-card__desc">Short description of this project.</span>
                    </span>
                </span>
            </span>
        </a>

        <!-- Central content: the name and tagline, still centered -->
        <div class="hero__center">
            <h1 data-animate="fade-up" data-animate-delay="0.1">Sambeg Shrestha</h1>
            <p data-animate="fade-up" data-animate-delay="0.3">Website is Development Process</p>
        </div>
    </section>

    <script src="nav.js"></script>
    <script src="background.js"></script>
    <script src="animations.js"></script>
    <script src="floating.js"></script>
</body>
</html>
