<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sambeg Shrestha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: 'Unica One', Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 2rem;
            /* Adds space around the content inside the box */
        }

        h1 {
            font-family: 'Italiana', serif;
            font-size: 3rem;
            color: #222;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #666;
        }

        /* Mobile: smaller heading/text and lighter padding so nothing overflows */
        @media (max-width: 600px) {
            body {
                height: auto;
                min-height: 100vh;
                padding: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>WEBSITE WORK IN PROGRESS</h1>
</body>
</html>
