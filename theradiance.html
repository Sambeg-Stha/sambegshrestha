<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiance Revolution &mdash; Sambeg Shrestha</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="project.css?v=4">
    <script src="script.js?v=7" defer></script>
</head>
<body class="project-page project-page--art">

    <a class="project-page__back" href="work.html" aria-label="Back to works">
        <span aria-hidden="true">&larr;</span>
    </a>

    <main id="project-content" class="project-content" data-category="art" aria-label="Project details">

        <!-- ============================================================
             01 · Intro
             Black hero area reserved for the project picture and title.
             ============================================================ -->
        <section class="project-section project-section--intro" aria-label="Project intro">
            <div class="project-hero">
                <figure class="project-hero__media">
                    <!-- Project picture goes here:
                         <img class="project-hero__image" src="" alt="">
                    -->
                </figure>

                <div class="project-hero__caption">
                    <h1 class="project-hero__title"></h1>
                    <p class="project-hero__meta"></p>
                </div>
            </div>
        </section>

        <hr class="project-divider">

        <!-- ============================================================
             02 · Project Description
             Square image (same as the works page) + text area beside it.
             ============================================================ -->
        <section class="project-section" aria-label="Project description">
            <div class="project-description">
                <figure class="project-description__media">
                    <img class="project-description__image" src="assets/art/TRP/TRP_T.png" alt="" width="800" height="800">
                </figure>

                <div class="project-description__body">
                    <h2 class="project-section__title"></h2>
                    <p class="project-text"></p>
                    <p class="project-text"></p>
                </div>
            </div>
        </section>

        <hr class="project-divider">

        <!-- ============================================================
             03 · Project Goals and Vision
             Simple bullet points. Duplicate one <li> per point.
             ============================================================ -->
        <section class="project-section" aria-label="Project goals and vision">
            <h2 class="project-section__title"></h2>

            <ul class="project-goals">
                <li class="project-goal"></li>
                <li class="project-goal"></li>
                <li class="project-goal"></li>
                <li class="project-goal"></li>
            </ul>
        </section>

        <hr class="project-divider">

        <!-- ============================================================
             04 · Current Development Status
             Blog-style updates with a date stamp and images.
             Duplicate one <article class="project-log__entry"> per update.
             ============================================================ -->
        <section class="project-section" aria-label="Current development status">
            <h2 class="project-section__title"></h2>

            <div class="project-log">
                <article class="project-log__entry">
                    <time class="project-log__date" datetime=""></time>

                    <div class="project-log__body">
                        <h3 class="project-log__title"></h3>
                        <p class="project-text"></p>
                        <figure class="project-log__media">
                            <!-- Update image goes here:
                                 <img src="" alt="">
                            -->
                        </figure>
                    </div>
                </article>
            </div>
        </section>

        <hr class="project-divider">

        <!-- ============================================================
             05 · Where to See the Project
             One universal link block. Duplicate the <li> for more links.
             ============================================================ -->
        <section class="project-section" aria-label="Where to see the project">
            <h2 class="project-section__title"></h2>

            <ul class="project-links">
                <li>
                    <a class="project-link" href="#">
                        <span class="project-link__icon" aria-hidden="true"></span>
                        <span class="project-link__label"></span>
                    </a>
                </li>
            </ul>
        </section>

        <hr class="project-divider">

        <!-- ============================================================
             06 · Extra
             Left empty for now.
             ============================================================ -->
        <section class="project-section" aria-label="Extra information">
            <h2 class="project-section__title"></h2>
        </section>

    </main>

</body>
</html>
